</head><body><header><div class="topbar"><div class="brand" onclick="nav(&#39;home&#39;)"><span class="logo">✦</span><span>نهمینو <small class="tiny">هوشمند</small></span></div><div class="actions"><span class="badge-role" id="who">مهمان</span><button class="btn" onclick="nav(&#39;tools&#39;)">ابزارها</button><button class="btn" onclick="nav(&#39;dashboard&#39;)">داشبورد</button><button class="btn primary" id="loginBtn" onclick="loginModal()">ورود</button></div></div></header><main id="app" class="shell"></main><dialog id="auth"><h2>ورود به نهمینو</h2><p>ورود در این نسخه فقط برای تست امکانات است؛ هر فرد می‌تواند نقش نمایشی انتخاب کند. برای ورود امن و استفاده چندنفره، مرحله بعد سرور و پایگاه داده لازم است.</p><div class="field"><label>نقش</label><select id="roleSelect"><option value="student">دانش‌آموز</option><option value="teacher">معلم</option><option value="owner">مدیر کل</option></select></div><div class="field"><label>نام نمایشی / شناسه دانش‌آموز</label><input id="personName" placeholder="مثلاً علی رضایی"></div><div id="authError" style="color:#c23d5b"></div><div class="inline-actions" style="margin-top:14px"><button class="btn primary" onclick="signIn()">ورود</button><button class="btn" onclick="document.getElementById(&#39;auth&#39;).close()">انصراف</button></div></dialog>
<script>
const SUBJECTS=[['math','ریاضی','#7464ec','∑'],['science','علوم تجربی','#12a789','⚗'],['persian','فارسی','#e27f4e','✒'],['writing','نگارش','#d856a9','✎'],['arabic','عربی','#23a2bb','ع'],['english','انگلیسی','#537bdf','A'],['social','مطالعات اجتماعی','#dc9c2c','🌐'],['religion','تعلیمات دینی','#54a76d','☀'],['defense','آمادگی دفاعی','#87924b','◆'],['tech','کار و فناوری','#a16ee4','⚙']];
const SECTIONS=[['book','سوالات متن کتاب','📖'],['exam','نمونه سوالات','📝'],['notes','جزوات','📚']];
const KEYS={items:'grade9_items',exams:'grade9_exams_v2',attempts:'grade9_attempts_v2',drafts:'grade9_drafts_v2',settings:'grade9_ai_settings_v2'};
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const read=k=>{try{return JSON.parse(localStorage.getItem(KEYS[k])||'[]')}catch{return []}};
const store=(k,v)=>localStorage.setItem(KEYS[k],JSON.stringify(v));
const sid=()=>crypto.randomUUID(), subj=id=>SUBJECTS.find(x=>x[0]===id),sect=id=>SECTIONS.find(x=>x[0]===id),now=()=>new Date().toISOString();
let user=null,route='home',params={},newFiles=[],editId=null,storedFiles=[];let urls=[];
function wipeURLs(){urls.forEach(URL.revokeObjectURL);urls=[]}function fileURL(b){const u=URL.createObjectURL(b);urls.push(u);return u}
function urlify(t){return esc(t).replace(/https?:\/\/[^\s<>"']+/g,m=>'<a target="_blank" rel="noopener noreferrer" href="'+m.replace(/&amp;/g,'&')+'">'+m+'</a>')}
function nav(v,p={}){route=v;params=p;render();window.scrollTo(0,0)}
const isStaff=()=>user&&['teacher','owner'].includes(user.role),isOwner=()=>user?.role==='owner';
function btn(text,fn,cls=''){return '<button type="button" class="btn '+cls+'" onclick="'+esc(fn)+'">'+text+'</button>'}
function loginModal(){$('auth').showModal()}
function signIn(){let role=$('roleSelect').value,name=$('personName').value.trim();if(!name)name=role==='owner'?'مدیر کل (آزمایشی)':role==='teacher'?'معلم (آزمایشی)':'';if(!name){$('authError').textContent='نام دانش‌آموز را وارد کنید';return}user={role,name,id:role==='student'?name:'staff-'+role};$('auth').close();nav('dashboard')}
function logout(){user=null;nav('home')}
function heading(t,s=''){return '<div class="sectiontitle"><h2>'+esc(t)+'</h2><span class="muted">'+esc(s)+'</span></div>'}
function footer(){return '<div class="footer">نهمینو • نسخه آزمایشی مرورگری • بدون دیتابیس مشترک یا هوش مصنوعی متصل</div>'}
function render(){wipeURLs();$('who').textContent=user?({owner:'👑 مدیر کل',teacher:'👩‍🏫 معلم',student:'🎒 دانش‌آموز'}[user.role]+' • '+user.name):'مهمان';$('loginBtn').textContent=user?'خروج':'ورود';$('loginBtn').onclick=user?logout:loginModal;const routes={home,subject,listing,detail,dashboard,contents,editor,exams,examEditor,takeExam,results,calendar,ai,tools};(routes[route]||home)()}
function home(){$('app').innerHTML='<section class="hero"><div class="eyebrow">پایگاه درس‌های پایه نهم</div><h1>نهمینو؛ کلاس و مدرسهٔ هوشمند شما</h1><p>جزوه‌ها، سوالات، آزمون آنلاین، کارنامه و دستیار هوش مصنوعی در یک فضا.</p></section>'+heading('📚 درس‌های پایه نهم','۱۰ درس')+'<div class="subjects">'+SUBJECTS.map(s=>'<button class="subject" style="--accent:'+s[2]+'" onclick="nav(&#39;subject&#39;,{s:&#39;'+s[0]+'&#39;})"><div class="symbol">'+s[3]+'</div><strong>'+s[1]+'</strong><small>'+read('items').filter(x=>x.subject===s[0]).length+' مطلب</small></button>').join('')+'</div>'+heading('امکانات آموزشی')+'<div class="tiles"><button class="tile" onclick="nav(&#39;exams&#39;)"><span class="bubble">📝</span><span><strong>امتحانات</strong><small>آزمون‌های منتشرشده</small></span></button><button class="tile" onclick="nav(&#39;calendar&#39;)"><span class="bubble">📅</span><span><strong>تقویم پیشرفت</strong><small>روزانه، هفتگی و ماهانه</small></span></button><button class="tile" onclick="nav(&#39;ai&#39;)"><span class="bubble">🤖</span><span><strong>استودیوی هوش مصنوعی</strong><small>آماده اتصال سروری</small></span></button></div>'+footer()}
function subject(){let s=subj(params.s);if(!s)return nav('home');$('app').innerHTML='<div class="pagehead" style="--accent:'+s[2]+'"><span class="pageicon">'+s[3]+'</span><div><h1>'+s[1]+'</h1><span class="muted">سه بخش آموزشی</span></div></div><div class="tiles">'+SECTIONS.map(c=>'<button class="tile" onclick="nav(&#39;listing&#39;,{s:&#39;'+s[0]+'&#39;,c:&#39;'+c[0]+'&#39;})"><span class="bubble">'+c[2]+'</span><span><strong>'+c[1]+'</strong><small>'+read('items').filter(x=>x.subject===s[0]&&x.section===c[0]).length+' مطلب</small></span></button>').join('')+'</div>'+footer()}
function listing(){let xs=read('items').filter(x=>x.subject===params.s&&x.section===params.c);$('app').innerHTML=heading((subj(params.s)?.[1]||'')+' / '+(sect(params.c)?.[1]||''),xs.length+' مورد')+'<div class="panel"><div class="items">'+(xs.length?xs.map((x,i)=>'<button class="item" onclick="nav(&#39;detail&#39;,{id:&#39;'+x.id+'&#39;})"><span class="number">'+(i+1)+'</span><span class="item-title">'+esc(x.title)+'</span> ←</button>').join(''):'<div class="empty">هنوز مطلبی افزوده نشده است.</div>')+'</div></div>'+btn('بازگشت به درس',`nav('subject',{s:'${params.s}'})`)}
async function openDb(){return new Promise((res,rej)=>{let req=indexedDB.open('grade9_files',1);req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains('files'))req.result.createObjectStore('files')};req.onsuccess=()=>res(req.result);req.onerror=()=>rej(req.error)})}
async function dbOp(mode,k,v){let db=await openDb();return new Promise((res,rej)=>{let tx=db.transaction('files',mode),s=tx.objectStore('files'),r=mode==='readonly'?s.get(k):v===null?s.delete(k):s.put(v,k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);tx.oncomplete=()=>db.close()})}
async function detail(){let x=read('items').find(x=>x.id===params.id);if(!x)return nav('home');let xs=read('items').filter(a=>a.subject===x.subject&&a.section===x.section),i=xs.findIndex(a=>a.id===x.id);$('app').innerHTML=heading(x.title,subj(x.subject)?.[1])+'<div class="panel"><div class="markdown">'+urlify(x.text)+'</div><div class="attachments" id="attachmentArea"></div><div class="navrow">'+(i>0?btn('→ قبلی',"nav('detail',{id:'"+xs[i-1].id+"'})"):'')+btn('بازگشت به فهرست',"nav('listing',{s:'"+x.subject+"',c:'"+x.section+"'})")+(i<xs.length-1?btn('بعدی ←',"nav('detail',{id:'"+xs[i+1].id+"'})",'primary'):'')+'</div></div>';for(let f of x.files||[]){let b=await dbOp('readonly',f.id);if(!b||!$('attachmentArea'))continue;let u=fileURL(b),ext=f.name.split('.').pop().toLowerCase(),view=/^(png|jpe?g|webp|gif|svg|avif)$/.test(ext)?'<img src="'+u+'">':/^(mp4|webm|mov)$/.test(ext)?'<video controls src="'+u+'"></video>':ext==='pdf'?'<iframe title="نمایش PDF" src="'+u+'"></iframe><p><a target="_blank" href="'+u+'">باز کردن PDF در تب جدید</a></p>':'<a download="'+esc(f.name)+'" href="'+u+'">دریافت فایل</a>';$('attachmentArea').insertAdjacentHTML('beforeend','<div class="attachment"><h3>📎 '+esc(f.name)+'</h3>'+view+'</div>')}}
function requireStaff(){if(!isStaff()){$('app').innerHTML='<div class="panel"><h2>این بخش مخصوص معلم و مدیر است</h2>'+btn('ورود','loginModal()')+'</div>';return false}return true}
function dashboard(){if(!user){$('app').innerHTML='<div class="panel"><h2>داشبورد شخصی</h2><p>برای دیدن کارنامه یا مدیریت امتحان وارد شوید.</p>'+btn('ورود','loginModal()','primary')+'</div>';return}let attempts=read('attempts').filter(a=>isOwner()||user.role==='teacher'?true:a.student===user.id);$('app').innerHTML=heading('داشبورد '+user.name,({owner:'مدیر کل',teacher:'معلم',student:'دانش‌آموز'}[user.role]))+'<div class="statrow"><div class="stat">مطالب<b>'+read('items').length+'</b></div><div class="stat">آزمون‌های فعال<b>'+read('exams').filter(e=>e.status==='published').length+'</b></div><div class="stat">پاسخ‌نامه‌ها<b>'+attempts.length+'</b></div><div class="stat">میانگین نمره<b>'+(attempts.length?(attempts.reduce((s,a)=>s+(Number(a.score)||0),0)/attempts.length).toFixed(1):'—')+'</b></div></div><div class="tiles">'+(isStaff()?'<button class="tile" onclick="nav(&#39;contents&#39;)">📚 مدیریت مطالب</button><button class="tile" onclick="nav(&#39;examEditor&#39;)">➕ طراحی آزمون</button><button class="tile" onclick="nav(&#39;ai&#39;)">🤖 هوش مصنوعی</button>':'')+'<button class="tile" onclick="nav(&#39;exams&#39;)">📝 آزمون‌ها</button><button class="tile" onclick="nav(&#39;results&#39;)">📊 کارنامه و نتایج</button><button class="tile" onclick="nav(&#39;calendar&#39;)">📅 تقویم پیشرفت</button></div>'+(isOwner()?'<p class="warning">مدیر کل می‌تواند پیش از انتشار، همه سؤال‌ها و کلید پاسخ آزمون‌های معلمان را مشاهده کند. دانش‌آموزان فقط آزمون‌های منتشرشده را می‌بینند.</p>':'')+footer()}
function contents(){if(!requireStaff())return;let xs=read('items');$('app').innerHTML='<div class="headflex"><h1>مدیریت مطالب</h1>'+btn('＋ مطلب تازه',"nav('editor')",'primary')+'</div><div class="panel stack">'+(xs.length?xs.map(x=>'<div class="item"><span class="item-title">'+esc(x.title)+' <small class="muted">'+esc(subj(x.subject)?.[1])+'</small></span>'+btn('ویرایش',"nav('editor',{id:'"+x.id+"'})")+(isOwner()?btn('حذف',"deleteContent('"+x.id+"')",'danger'):'')+'</div>').join(''):'<div class="empty">مطلبی موجود نیست.</div>')+'</div>'}
function editor(){if(!requireStaff())return;let x=read('items').find(x=>x.id===params.id)||{};editId=x.id||null;newFiles=[];storedFiles=x.files||[];$('app').innerHTML=heading(editId?'ویرایش مطلب':'ساخت مطلب')+'<form class="panel fields" onsubmit="saveContent(event)"><div class="two"><div class="field"><label>درس</label><select id="cSubject">'+SUBJECTS.map(s=>'<option value="'+s[0]+'" '+(x.subject===s[0]?'selected':'')+'>'+s[1]+'</option>').join('')+'</select></div><div class="field"><label>بخش</label><select id="cSection">'+SECTIONS.map(c=>'<option value="'+c[0]+'" '+(x.section===c[0]?'selected':'')+'>'+c[1]+'</option>').join('')+'</select></div></div><div class="field"><label>عنوان</label><input required id="cTitle" value="'+esc(x.title||'')+'"></div><div class="field"><label>متن</label><textarea id="cText">'+esc(x.text||'')+'</textarea></div><div class="field"><label>پیوست‌ها (هر فایل تا ۲۰ مگابایت)</label><input type="file" multiple accept="image/*,video/*,.pdf,.txt,.csv,.md,.json,.doc,.docx,.ppt,.pptx" onchange="addFiles(this.files)"><div id="filesChosen" class="filelist"></div></div><div class="inline-actions"><button class="btn primary">ذخیره</button>'+btn('بازگشت',"nav('contents')")+'</div></form>';showFiles()}
function addFiles(files){for(let f of files){if(f.size>20*1024*1024){alert('حجم فایل '+f.name+' بیش از ۲۰ مگابایت است');continue}if(!/\.(png|jpe?g|gif|webp|svg|avif|mp4|webm|mov|pdf|txt|csv|md|json|docx?|pptx?)$/i.test(f.name)){alert('نوع فایل مجاز نیست');continue}newFiles.push({id:sid(),name:f.name,type:f.type,blob:f})}showFiles()}
function showFiles(){let el=$('filesChosen');if(el)el.innerHTML=[...storedFiles,...newFiles].map(f=>'<span class="filebadge">'+esc(f.name)+' <button type="button" onclick="dropFile(&#39;'+f.id+'&#39;)">×</button></span>').join('')}
function dropFile(id){newFiles=newFiles.filter(f=>f.id!==id);storedFiles=storedFiles.filter(f=>f.id!==id);showFiles()}
async function saveContent(e){e.preventDefault();let xs=read('items'),old=xs.find(x=>x.id===editId),item={id:editId||sid(),subject:$('cSubject').value,section:$('cSection').value,title:$('cTitle').value,text:$('cText').value,files:[...storedFiles,...newFiles].map(({id,name,type})=>({id,name,type})),author:user.name};try{for(let f of newFiles)await dbOp('readwrite',f.id,f.blob);for(let f of old?.files||[])if(!storedFiles.some(v=>v.id===f.id))await dbOp('readwrite',f.id,null);store('items',editId?xs.map(x=>x.id===editId?item:x):[...xs,item]);nav('contents')}catch(err){alert('خطا در ذخیره فایل: '+err.message)}}
async function deleteContent(id){if(!isOwner()||!confirm('مطلب حذف شود؟'))return;let xs=read('items'),x=xs.find(a=>a.id===id);for(let f of x?.files||[])await dbOp('readwrite',f.id,null);store('items',xs.filter(a=>a.id!==id));nav('contents')}
function exams(){let xs=read('exams').filter(x=>isStaff()||x.status==='published');$('app').innerHTML='<div class="headflex"><h1>امتحانات</h1>'+(isStaff()?btn('＋ طراحی امتحان',"nav('examEditor')",'primary'):'')+'</div><div class="stack">'+(xs.length?xs.map(x=>'<div class="panel headflex"><div><h2>'+esc(x.title)+'</h2><p class="tiny">'+esc(subj(x.subject)?.[1])+' • '+x.questions.length+' سؤال • '+(x.status==='published'?'منتشرشده':'پیش‌نویس محرمانه')+' • طراح: '+esc(x.author)+'</p></div><div class="inline-actions">'+(isStaff()?btn('مشاهده سؤال‌ها و کلید',"nav('examEditor',{id:'"+x.id+"'})")+btn(x.status==='published'?'برداشتن انتشار':'انتشار',"toggleExam('"+x.id+"')")+(isOwner()?btn('حذف',"removeExam('"+x.id+"')",'danger'):''):btn('شروع آزمون',"nav('takeExam',{id:'"+x.id+"'})",'primary'))+'</div></div>').join(''):'<div class="empty panel">هنوز امتحانی ثبت نشده است.</div>')+'</div>'}
function toggleExam(id){if(!isStaff())return;let xs=read('exams');store('exams',xs.map(x=>x.id===id?{...x,status:x.status==='published'?'draft':'published'}:x));nav('exams')}
function removeExam(id){if(!isOwner()||!confirm('آزمون حذف شود؟'))return;store('exams',read('exams').filter(x=>x.id!==id));nav('exams')}
function examEditor(){if(!requireStaff())return;let x=read('exams').find(e=>e.id===params.id)||{};$('app').innerHTML=heading(x.id?'مشاهده و ویرایش امتحان':'طرح امتحان جدید')+'<form class="panel fields" onsubmit="saveExam(event)"><div class="field"><label>عنوان امتحان</label><input id="eTitle" required value="'+esc(x.title||'')+'"></div><div class="field"><label>درس</label><select id="eSubject">'+SUBJECTS.map(s=>'<option value="'+s[0]+'" '+(x.subject===s[0]?'selected':'')+'>'+s[1]+'</option>').join('')+'</select></div><p class="note">برای هر سؤال، متن، نوع، گزینه‌ها، بارم و کلید پاسخ را وارد کنید. کلید پاسخ فقط برای مدیر و معلم قابل مشاهده است؛ در نسخه آنلاین باید توسط سرور حفاظت شود.</p><div id="questions"></div><div class="inline-actions">'+btn('＋ افزودن سؤال','addQuestion()', '')+'<button type="submit" class="btn primary">ذخیره پیش‌نویس</button>'+btn('بازگشت',"nav('exams')")+'</div></form>';let q=x.questions?.length?x.questions:[{type:'mcq',text:'',options:['','','',''],answer:'0',points:1}];q.forEach(addQuestion)}
let qcounter=0;function addQuestion(q={}){let n=qcounter++;$('questions').insertAdjacentHTML('beforeend','<div class="examcard" data-q="'+n+'"><div class="headflex"><strong>سؤال</strong>'+btn('حذف',"document.querySelector('[data-q=\""+n+"\"]').remove()",'danger')+'</div><div class="field"><label>متن سؤال</label><textarea class="qtext answer">'+esc(q.text||'')+'</textarea></div><div class="two"><div class="field"><label>نوع</label><select class="qtype" onchange="this.closest(&#39;.examcard&#39;).querySelector(&#39;.mcqopts&#39;).hidden=this.value!==&#39;mcq&#39;"><option value="mcq" '+(q.type!=='text'?'selected':'')+'>چهارگزینه‌ای</option><option value="text" '+(q.type==='text'?'selected':'')+'>تشریحی کوتاه</option></select></div><div class="field"><label>بارم</label><input type="number" class="qpoints" min="0.1" step="0.1" value="'+(q.points||1)+'"></div></div><div class="mcqopts" '+(q.type==='text'?'hidden':'')+'><label>گزینه‌ها</label>'+[0,1,2,3].map(i=>'<input class="qopt" placeholder="گزینه '+(i+1)+'" value="'+esc((q.options||[])[i]||'')+'">').join('')+'</div><div class="field"><label>پاسخ صحیح (شماره گزینه از ۱ تا ۴ یا پاسخ تشریحی نمونه)</label><input class="qanswer" value="'+esc(q.type==='mcq'?String(Number(q.answer??0)+1):q.answer||'')+'"></div></div>')}
function gatherQ(){return [...document.querySelectorAll('[data-q]')].map(el=>{let type=el.querySelector('.qtype').value,a=el.querySelector('.qanswer').value.trim();return {text:el.querySelector('.qtext').value.trim(),type,points:Number(el.querySelector('.qpoints').value)||1,options:type==='mcq'?[...el.querySelectorAll('.qopt')].map(i=>i.value):[],answer:type==='mcq'?String(Math.max(0,Math.min(3,(Number(a)||1)-1))):a}}).filter(q=>q.text)}
function saveExam(e){e.preventDefault();let xs=read('exams'),old=xs.find(x=>x.id===params.id),questions=gatherQ();if(!questions.length)return alert('حداقل یک سؤال لازم است');let x={id:old?.id||sid(),title:$('eTitle').value,subject:$('eSubject').value,questions,author:old?.author||user.name,status:old?.status||'draft',created:old?.created||now()};store('exams',old?xs.map(v=>v.id===x.id?x:v):[...xs,x]);nav('exams')}
function takeExam(){if(!user){$('app').innerHTML='<div class="panel">ابتدا با نقش دانش‌آموز وارد شوید. '+btn('ورود','loginModal()')+'</div>';return}if(user.role!=='student'){return nav('exams')}let x=read('exams').find(v=>v.id===params.id&&v.status==='published');if(!x)return nav('exams');$('app').innerHTML=heading(x.title,subj(x.subject)?.[1])+'<form class="panel" onsubmit="submitExam(event)">'+x.questions.map((q,i)=>'<div class="examcard"><strong>سؤال '+(i+1)+' — '+q.points+' نمره</strong><p>'+esc(q.text)+'</p>'+(q.type==='mcq'?q.options.map((o,j)=>'<label style="display:block;margin:9px 0"><input type="radio" name="ans'+i+'" value="'+j+'"> '+esc(o)+'</label>').join(''):'<div class="field"><textarea class="answer" name="ans'+i+'" placeholder="پاسخ خود را وارد کنید"></textarea></div>')+'</div>').join('')+'<button class="btn primary">ثبت و تصحیح آزمون</button></form>'}
function submitExam(e){e.preventDefault();let x=read('exams').find(e=>e.id===params.id);if(!x||!user||user.role!=='student')return;let form=new FormData(e.target),answers=x.questions.map((q,i)=>String(form.get('ans'+i)||'').trim()),total=x.questions.reduce((a,q)=>a+q.points,0),earned=0;let grading=x.questions.map((q,i)=>{let correct=q.type==='mcq'?answers[i]===q.answer:normalize(answers[i])===normalize(q.answer)&&!!answers[i];if(correct)earned+=q.points;return {earned:correct?q.points:0,correct,needsReview:q.type==='text'&&!correct}});let attempt={id:sid(),examId:x.id,student:user.id,studentName:user.name,date:now(),answers,grading,score:total?Math.round(earned/total*200)/10:0,max:20};store('attempts',[...read('attempts'),attempt]);nav('results',{id:attempt.id})}
function normalize(s){return String(s||'').toLocaleLowerCase('fa').replace(/[ي]/g,'ی').replace(/[ك]/g,'ک').replace(/\s+/g,' ').trim()}
function results(){if(!user)return nav('dashboard');let xs=read('attempts').filter(a=>isStaff()||a.student===user.id),specific=params.id?xs.find(a=>a.id===params.id):null;$('app').innerHTML=heading('کارنامه و نتایج',xs.length+' آزمون')+(specific?'<div class="panel"><h2>نتیجه آزمون</h2><div class="grade">'+specific.score+' از ۲۰</div><p>پاسخ‌های تشریحی با تطبیق دقیق پاسخ نمونه بررسی شده‌اند. برای ارزیابی معنایی هوشمند باید سرور AI وصل شود؛ نمره نهایی نیازمند بازبینی معلم است.</p></div>':'')+'<div class="panel stack">'+(xs.length?xs.slice().reverse().map(a=>{let exam=read('exams').find(e=>e.id===a.examId);return '<div class="item"><div class="item-title">'+esc(exam?.title||'آزمون حذف‌شده')+'<small class="tiny"> • '+esc(a.studentName)+' • '+new Date(a.date).toLocaleDateString('fa-IR')+'</small></div><b>'+a.score+'/۲۰</b>'+(isStaff()?btn('بازبینی',"reviewAttempt('"+a.id+"')"):'')+'</div>'}).join(''):'<div class="empty">کارنامه‌ای ثبت نشده است.</div>')+'</div>'}
function reviewAttempt(id){if(!isStaff())return;let a=read('attempts').find(x=>x.id===id),exam=read('exams').find(e=>e.id===a.examId);$('app').innerHTML=heading('بازبینی پاسخ‌های '+a.studentName)+'<div class="panel">'+(exam?.questions||[]).map((q,i)=>'<div class="examcard"><b>'+esc(q.text)+'</b><p>پاسخ دانش‌آموز: '+esc(q.type==='mcq'?q.options[Number(a.answers[i])]||'بدون پاسخ':a.answers[i]||'بدون پاسخ')+'</p><p>کلید: '+esc(q.type==='mcq'?q.options[Number(q.answer)]:q.answer)+'</p><div class="field"><label>نمره کسب‌شده / '+q.points+'</label><input type="number" min="0" max="'+q.points+'" step="0.1" class="reviewMark" value="'+a.grading[i].earned+'"></div></div>').join('')+btn('ثبت نمره بازبینی',"saveReview('"+id+"')",'primary')+'</div>'}
function saveReview(id){if(!isStaff())return;let xs=read('attempts'),a=xs.find(x=>x.id===id),exam=read('exams').find(x=>x.id===a.examId),marks=[...document.querySelectorAll('.reviewMark')].map((el,i)=>Math.max(0,Math.min(Number(exam.questions[i].points),Number(el.value)||0))),total=exam.questions.reduce((s,q)=>s+q.points,0);a.grading=a.grading.map((g,i)=>({...g,earned:marks[i],needsReview:false}));a.score=total?Math.round(marks.reduce((s,v)=>s+v,0)/total*200)/10:0;a.reviewedBy=user.name;store('attempts',xs);nav('results',{id})}
function calendar(){let date=new Date(),month=Number(params.month??date.getMonth()),year=Number(params.year??date.getFullYear());if(month<0){month=11;year--}if(month>11){month=0;year++}let start=new Date(year,month,1),days=new Date(year,month+1,0).getDate(),offset=(start.getDay()+1)%7, xs=read('attempts').filter(a=>!user||!isStaff()?a.student===user?.id:true),items=Array.from({length:offset+days},(_,i)=>{let d=i-offset+1;if(d<1)return '<div class="daybox emptyday"></div>';let matches=xs.filter(a=>{let t=new Date(a.date);return t.getFullYear()===year&&t.getMonth()===month&&t.getDate()===d});return '<div class="daybox '+(date.getDate()===d&&date.getMonth()===month&&date.getFullYear()===year?'today':'')+'"><b>'+d+'</b><span>'+ (matches.length?matches.length+' آزمون':'—')+'</span>'+(matches.length?'<br>میانگین '+(matches.reduce((s,a)=>s+a.score,0)/matches.length).toFixed(1):'')+'</div>'}).join('');let today=new Date(),startWeek=new Date(today);startWeek.setDate(today.getDate()-((today.getDay()+1)%7));let recent=xs.filter(a=>new Date(a.date)>=startWeek), daily=xs.filter(a=>new Date(a.date).toDateString()===today.toDateString()),monthly=xs.filter(a=>{let d=new Date(a.date);return d.getMonth()===month&&d.getFullYear()===year});$('app').innerHTML=heading('تقویم و جدول پیشرفت')+'<div class="statrow"><div class="stat">امروز<b>'+daily.length+'</b></div><div class="stat">این هفته<b>'+recent.length+'</b></div><div class="stat">این ماه<b>'+monthly.length+'</b></div><div class="stat">میانگین ماه<b>'+(monthly.length?(monthly.reduce((s,a)=>s+a.score,0)/monthly.length).toFixed(1):'—')+'</b></div></div><div class="panel"><div class="headflex"><h2>'+new Intl.DateTimeFormat('fa-IR',{month:'long',year:'numeric'}).format(start)+'</h2><div>'+btn('ماه قبل',"nav('calendar',{month:"+(month-1)+",year:"+year+"})")+btn('ماه بعد',"nav('calendar',{month:"+(month+1)+",year:"+year+"})")+'</div></div><div class="reportgrid">'+['شنبه','یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه'].map(t=>'<div class="daybox"><b>'+t+'</b></div>').join('')+items+'</div></div>'+footer()}
function ai(){if(!requireStaff())return;let sources=read('items');$('app').innerHTML=heading('🤖 استودیوی دستیار هوش مصنوعی','آماده اتصال به API روی سرور')+'<div class="warning">در حالت فعلی هیچ مدلی به سایت وصل نشده و محتوای ساختگی به‌عنوان خروجی AI نمایش داده نمی‌شود. برای اتصال واقعی، سرور باید مسیر امن /api/ai/generate را ارائه کند و کلید API فقط روی سرور ذخیره شود.</div><div class="panel fields"><div class="two"><div class="field"><label>نوع درخواست</label><select id="aiTask"><option value="notes">ساخت جزوه</option><option value="questions">طراحی سوال</option><option value="exam">طراحی امتحان همراه پاسخنامه</option><option value="grading">پیشنهاد معیار تصحیح تشریحی</option></select></div><div class="field"><label>درس</label><select id="aiSubject">'+SUBJECTS.map(s=>'<option value="'+s[0]+'">'+s[1]+'</option>').join('')+'</select></div></div><div class="field"><label>دستور شما</label><textarea id="aiInstruction" class="promptbox" placeholder="مثلاً از منابع انتخابی ۱۰ سؤال چهارگزینه‌ای با پاسخ صحیح و بارم بساز"></textarea></div><div class="field"><label>منابع محتوایی (برای انتخاب چند مورد Ctrl یا لمس چندگانه)</label><select id="aiSources" multiple size="5">'+sources.map(x=>'<option value="'+x.id+'">'+esc(subj(x.subject)?.[1])+' — '+esc(x.title)+'</option>').join('')+'</select></div><div class="inline-actions">'+btn('ساخت پرامپت و کپی','copyAIPrompt()')+btn('ارسال به API سرور','generateAI()','primary')+'</div><div id="aiResult"></div></div><div class="note" style="margin-top:15px">طرح هوش مصنوعی: بازیابی بخش‌های مرتبط از منابع → تولید جزوه/سؤال → بررسی و تأیید معلم یا مدیر → انتشار. برای امتحانات، پاسخنامه فقط به نقش‌های مجاز و از طریق کنترل مجوز سرور داده شود.</div>'}
function aiPayload(){let ids=[...$('aiSources').selectedOptions].map(o=>o.value),sources=read('items').filter(x=>ids.includes(x.id)).map(x=>({title:x.title,text:x.text,subject:x.subject}));return {task:$('aiTask').value,subject:$('aiSubject').value,instruction:$('aiInstruction').value,sources}}
function promptText(){let p=aiPayload();return 'شما دستیار آموزشی پایه نهم هستید. فقط با تکیه بر منابع زیر کار کنید. اگر منابع کافی نیست، صریح بگویید. هیچ مطلبی را بدون ارجاع به منبع جعل نکنید. خروجی فارسی و منظم باشد.\nنوع درخواست: '+p.task+'\nدرس: '+(subj(p.subject)?.[1]||'')+'\nدستور: '+p.instruction+'\nمنابع:\n'+p.sources.map((s,i)=>(i+1)+'. '+s.title+'\n'+s.text).join('\n\n')}
async function copyAIPrompt(){try{await navigator.clipboard.writeText(promptText());$('aiResult').innerHTML='<p class="note">پرامپت کپی شد؛ می‌توانید آن را در ChatGPT یا ابزار دیگر استفاده کنید.</p>'}catch{$('aiResult').innerHTML='<textarea readonly>'+esc(promptText())+'</textarea>'}}
async function generateAI(){let el=$('aiResult');el.innerHTML='<p class="note">درخواست در حال بررسی اتصال سرور...</p>';try{let response=await fetch('/api/ai/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...aiPayload(),prompt:promptText()})});if(!response.ok)throw Error('HTTP '+response.status);let data=await response.json();if(typeof data.text!=='string')throw Error('فرمت پاسخ نامعتبر');el.innerHTML='<div class="panel" style="margin-top:14px"><h3>پیش‌نویس تولیدشده — پیش از انتشار بازبینی کنید</h3><div class="markdown">'+esc(data.text)+'</div><div class="inline-actions">'+btn('کپی پیش‌نویس','copyAIResult()')+'</div></div>';el.dataset.result=data.text}catch(e){el.innerHTML='<p class="warning">سرور هوش مصنوعی هنوز راه‌اندازی نشده یا پاسخگو نیست ('+esc(e.message)+'). از دکمه «ساخت پرامپت و کپی» استفاده کنید.</p>'}}
async function copyAIResult(){await navigator.clipboard.writeText($('aiResult').dataset.result||'')}
function tools(){const results=read('items');$('app').innerHTML=heading('ابزارها و جست‌وجو','جست‌وجوی محتوای منتشرشده و پشتیبان‌گیری محلی')+'<div class="panel fields"><div class="field"><label>جست‌وجو در جزوه‌ها و مطالب</label><input id="lookup" oninput="runSearch()" placeholder="عنوان یا عبارت درسی را بنویسید"></div><div id="lookupResults" class="stack"></div></div>'+(isStaff()?'<div class="panel" style="margin-top:16px"><h2>پشتیبان‌گیری اطلاعات</h2><p class="tiny">این خروجی شامل عنوان‌ها، متن‌ها، آزمون‌ها و نمرات است؛ فایل‌های پیوست که در IndexedDB مرورگر نگهداری می‌شوند داخل خروجی نیستند. خروجی را محرمانه نگه دارید.</p><div class="inline-actions">'+btn('دریافت پشتیبان JSON','exportBackup()','primary')+'<label class="btn">بازیابی پشتیبان <input type="file" accept=".json,application/json" hidden onchange="importBackup(this.files[0])"></label></div></div>':'')+'<p class="warning">این نسخه فقط نمایشی و محلی است؛ اطلاعات هر مرورگر جداست. رمزهای ورود نمایشی هستند و نباید برای کاربران واقعی روی اینترنت استفاده شوند. برای ورود امن و همگام‌سازی اطلاعات باید سرور و دیتابیس وصل شود.</p>';runSearch()}
function runSearch(){let q=($('lookup')?.value||'').trim().toLocaleLowerCase('fa'),arr=read('items').filter(x=>q&&(x.title+' '+x.text+' '+(subj(x.subject)?.[1]||'')).toLocaleLowerCase('fa').includes(q)).slice(0,40);$('lookupResults').innerHTML=!q?'<p class="tiny">با واردکردن عبارت، مطالب این مرورگر نمایش داده می‌شوند.</p>':(arr.length?arr.map(x=>'<button class="item" onclick="nav(&#39;detail&#39;,{id:&#39;'+x.id+'&#39;})">'+esc(x.title)+' <small>'+esc(subj(x.subject)?.[1])+'</small></button>').join(''):'<p class="tiny">مطلبی پیدا نشد.</p>')}
function exportBackup(){if(!isStaff())return;let data={version:1,created:now(),items:read('items'),exams:read('exams'),attempts:read('attempts')};let a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.href=u;a.download='nahomino-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)}
async function importBackup(f){if(!isOwner()||!f)return alert('بازیابی فقط برای مدیر کل مجاز است');if(!confirm('مطالب، آزمون‌ها و نمرات این مرورگر با اطلاعات پشتیبان جایگزین شوند؟'))return;try{let d=JSON.parse(await f.text());if(!Array.isArray(d.items)||!Array.isArray(d.exams)||!Array.isArray(d.attempts))throw Error('ساختار فایل معتبر نیست');store('items',d.items);store('exams',d.exams);store('attempts',d.attempts);alert('بازیابی انجام شد؛ پیوست‌ها در فایل پشتیبان وجود ندارند.');nav('dashboard')}catch(e){alert('فایل پشتیبان نامعتبر است: '+e.message)}}
render();
</script></body></html>
