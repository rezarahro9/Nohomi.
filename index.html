glass{background:linear-gradient(145deg,#1b2340ef,#11182be9);border:1px solid var(--stroke);border-radius:var(--radius);box-shadow:0 16px 45px #0002}.hero{position:relative;padding:45px;overflow:hidden;background:linear-gradient(125deg,#322d7b,#273e6d 65%,#0b5967);border:1px solid #ffffff29;border-radius:32px}.hero:after{content:'✦';position:absolute;left:5%;top:-100px;font-size:320px;color:#ffffff0b;animation:float 8s ease-in-out infinite}.hero h1{font-size:clamp(28px,4.5vw,54px);margin:12px 0;line-height:1.35}.hero p{color:#e0e4ff;max-width:650px}.hero .eyebrow{color:#7df1e1;font-weight:900}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:20px 0}.stat{padding:22px;background:#ffffff09;border:1px solid var(--stroke);border-radius:19px}.stat b{font-size:27px;display:block}.stat span{font-size:12px;color:var(--mute)}h2{font-size:22px;margin:0 0 16px}h3{margin:0 0 12px}.section{margin:30px 0}.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:13px}.course{padding:22px 14px;text-align:right;background:linear-gradient(150deg,color-mix(in srgb,var(--course) 22%,#182038),#141a30);border:1px solid color-mix(in srgb,var(--course) 36%,transparent);border-radius:20px;color:white;transition:.25s}.course:hover,.tile:hover{transform:translateY(-5px);box-shadow:0 15px 35px #0004}.course .emoji{font-size:31px;display:block;margin-bottom:10px}.course small{color:var(--mute)}.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.tile{background:#ffffff0a;border:1px solid var(--stroke);color:white;border-radius:20px;padding:22px;text-align:right;transition:.25s}.tile strong{display:block;font-size:18px}.tile small{color:var(--mute)}.panel{padding:24px}.row{display:flex;gap:12px;align-items:center}.between{justify-content:space-between}.wrap{flex-wrap:wrap}.muted{color:var(--mute)}.small{font-size:12px}.list{display:grid;gap:9px}.item{padding:16px;background:#ffffff08;border:1px solid var(--stroke);border-radius:15px;display:flex;align-items:center;gap:12px;justify-content:space-between}.item .num{background:#877aff25;color:#c8beff;padding:7px 12px;border-radius:11px}.fields{display:grid;gap:14px}.two{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}label{font-size:13px;font-weight:700;display:block;margin-bottom:7px;color:#c4cce5}input,textarea,select{width:100%;border-radius:13px;background:#0b1123;border:1px solid #ffffff27;color:var(--text);padding:12px 13px;outline:none}textarea{min-height:125px;resize:vertical}select option{color:white;background:#10152b}.hint{font-size:12px;color:var(--mute)}.notice{background:#caa84916;border:1px solid #f6cc5d44;padding:13px 16px;border-radius:15px;color:#ead9aa;margin:15px 0}.success{color:var(--good)}.red{color:var(--bad)}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{border:1px solid #ffffff2a;background:#ffffff0d;border-radius:50px;padding:7px 12px;color:white;font-size:12px}.qcard{padding:19px;border:1px solid var(--stroke);background:#ffffff07;border-radius:18px;margin:12px 0}.qcard strong{line-height:2}.option{display:flex;align-items:center;gap:8px;padding:10px;border:1px solid #ffffff1b;border-radius:12px;margin:8px 0}.option input{width:auto;accent-color:#8177fc}.optgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.optgrid input{min-width:0}.mark{padding:4px 9px;border-radius:12px;background:#ffffff0b}.tag{padding:5px 10px;border-radius:10px;background:#8177ff24;font-size:12px;color:#d9d2ff}.empty{padding:45px 18px;text-align:center;color:var(--mute)}.avatar{height:38px;width:38px;background:linear-gradient(145deg,#7c69ed,#23acb0);border-radius:14px;display:grid;place-items:center}.leader{display:grid;grid-template-columns:45px 1fr 1fr 90px;gap:10px;align-items:center;padding:13px;border-bottom:1px solid var(--stroke)}.leader:last-child{border:0}.rank{font-size:20px}.barbg{background:#ffffff19;height:8px;border-radius:40px;ov const lessons=[['math','ریاضی','#8976ff','📐'],['science','علوم تجربی','#19c9bd','🔬'],['persian','فارسی','#ff8a91','📖'],['writing','نگارش','#f5b858','✍️'],['arabic','عربی','#66b2f5','🕌'],['english','انگلیسی','#b388ff','🌍'],['social','مطالعات اجتماعی','#edb367','🏛️'],['religion','تعلیمات دینی','#48c68a','🌙'],['defense','آمادگی دفاعی','#ee7895','🛡️'],['tech','کار و فناوری','#7cb7ff','💻']];const sections=[['text','سؤالات متن کتاب','❔'],['sample','نمونه سؤالات','📝'],['notes','جزوات','📚'],['homework','مشق و پاسخ','✍️'],['special','جزوات خاص','🌟']];const K='nahomino-v3-';const get=(k)=>{try{return JSON.parse(localStorage.getItem(K+k))||[]}catch{return []}};const set=(k,v)=>localStorage.setItem(K+k,JSON.stringify(v));const uuid=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+Math.random().toString(36).slice(2);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const h=(id)=>document.getElementById(id);const lesson=k=>lessons.find(x=>x[0]===k);let sessionToken=localStorage.getItem(K+'token')||'';let role='student',name='دانش‌آموز مهمان',route='home',args={},draft=[],editExam=null,imageData=null;const isAdmin=()=>role==='admin';const isStaff=()=>role==='admin'||role==='teacher';const nav=[['home','خانه'],['subjects','درس‌ها'],['exams','امتحانات'],['scores','نمرات و رتبه‌ها'],['ai','استودیوی AI'],['admin','مدیریت']];function go(r,a={}){route=r;args=a;render();scrollTo({top:0,behavior:'smooth'})}function button(t,fn,cls='subtle'){return `<button class="${cls}" onclick="${fn}">${t}</button>`}function heading(title,desc=''){return `<div class="sectionhead"><div><h2>${esc(title)}</h2><div class="muted small">${esc(desc)}</div></div></div>`}function showLogin(){if(window.SUPABASE_URL&&window.SUPABASE_ANON_KEY){showRealLogin();return}h('modal').innerHTML=`<div class="modal" onclick="if(event.target===this)this.remove()"><div class="glass panel dialog"><h2>ورود نمایشی</h2><p class="muted">برای بررسی ظاهر نقش‌هاست؛ احراز هویت امن پس از اتصال Supabase انجام می‌شود.</p><div class="fields"><label>نام نمایشی</label><input id="loginName" value="${esc(name)}"><label>نقش نمایشی</label><select id="loginRole"><option value="student">دانش‌آموز</option><option value="teacher">معلم</option><option value="admin">مدیر کل</option></select><button class="primary" onclick="name=h('loginName').value.trim()||'مهمان';role=h('loginRole').value;h('modal').innerHTML='';go('home')">ورود به پیش‌نمایش</button></div></div></div>`}function render(){h('identity').textContent=({student:'🎒',teacher:'👩‍🏫',admin:'👑'}[role])+' '+name;h('tabs').innerHTML=nav.map(([r,t])=>`<button class="${r===route?'active':''}" onclick="go('${r}')">${t}</button>`).join('');const pages={home,subjects,subject,listing,article,exams,examEdit,examTake,scores,ai,admin,articleEdit};h('main').innerHTML=`<div class="anim">${(pages[route]||home)()}</div>`;if(route==='examEdit')rebuildQuestions();}function home(){let ps=get('posts'),es=get('exams'),ats=get('attempts');return `<div class="hero"><div class="eyebrow">✦ آینده یادگیری، همین‌جاست</div><h1>نهمینو؛ درس بخون،<br>بدرخش، پیشرفت کن ✨</h1><p>درس‌های پایه نهم، جزوه‌های خاص، امتحان‌های جذاب و یک دستیار هوشمند برای ساخت سؤال و یادگیری.</p><div class="row wrap" style="margin-top:22px">${button('شروع مطالعه',"go('subjects')",'primary')}${button('آزمون‌ها',"go('exams')")}</div></div><div class="stats"><div class="stat"><b>۱۰</b><span>درس پایه نهم</span></div><div class="stat"><b>${ps.length}</b><span>مطلب و جزوه</span></div><div class="stat"><b>${es.filter(x=>x.published).length}</b><span>آزمون منتشرشده</span></div><div class="stat"><b>${ats.length}</b><span>شرکت در آزمون</span></div></div>${heading('درس‌ها را کشف کن','دسترسی به جزوه، مشق و نمونه سؤال')}<div class="grid">${lessons.map(x=>`<button class="course" style="--course:${x[2]}" onclick="go('subject',{s:'${x[0]}'})"><span class="emoji">${x[3]}</span><b>${x[1]}</b><br><small>مشاهده مطالب ←</small></button>`).join('')}</div><section class="section glass panel"><div class="row wrap between"><div><h2>🧠 استودیوی هوش مصنوعی</h2><p class="muted">از متن یا عکس، آزمون و جزوه بساز؛ پیش از انتشار بازبینی کن.</p></div>${button('بازکردن استودیو',"go('ai')",'primary')}</div></section>${foot()}`}function foot(){return '<footer>نهمینو ✦ نسخه پیش‌نمایش | داده‌های این نسخه فقط در مرورگر ذخیره می‌شوند | داده واقعی دانش‌آموزان را وارد نکنید</footer>'}function subjects(){return heading('📚 همه درس‌های پایه نهم')+`<div class="grid">${lessons.map(x=>`<button class="course" style="--course:${x[2]}" onclick="go('subject',{s:'${x[0]}'})"><span class="emoji">${x[3]}</span><b>${x[1]}</b></button>`).join('')}</div>`+foot()}function subject(){let x=lesson(args.s)||lessons[0];return `<div class="hero" style="padding:25px 35px;background:linear-gradient(120deg,${x[2]}77,#1a2349)"><h1>${x[3]} ${x[1]}</h1><p>دسته موردنظر را برای مطالعه انتخاب کن.</p></div><section class="section"><div class="tiles">${sections.map(s=>`<button class="tile" onclick="go('listing',{s:'${x[0]}',c:'${s[0]}'})"><span style="font-size:30px">${s[2]}</span><strong>${s[1]}</strong><small>${get('posts').filter(p=>p.subject===x[0]&&p.section===s[0]).length} مطلب</small></button>`).join('')}</div></section>`}function listing(){let list=get('posts').filter(p=>p.subject===args.s&&p.section===args.c);let l=lesson(args.s),sec=sections.find(x=>x[0]===args.c);return heading(`${l?.[1]} / ${sec?.[1]}`,`${list.length} مطلب`)+`<div class="glass panel list">${list.length?list.map((p,i)=>`<div class="item"><span class="num">${i+1}</span><b style="flex:1">${esc(p.title)}</b>${button('مشاهده',`go('article',{id:'${p.id}'})`)}</div>`).join(''):'<div class="empty">هنوز مطلبی منتشر نشده است.</div>'}</div><p>${button('بازگشت به درس',`go('subject',{s:'${args.s}'})`)}</p>`}function article(){let p=get('posts').find(p=>p.id===args.id);if(!p)return '<div class="empty">مطلب یافت نشد</div>';let items=get('posts').filter(x=>x.subject===p.subject&&x.section===p.section),i=items.findIndex(x=>x.id===p.id);return heading(p.title,lesson(p.subject)?.[1])+`<article class="glass panel"><div style="white-space:pre-wrap;line-height:2.3;overflow-wrap:anywhere">${esc(p.text).replace(/https?:\/\/[^\s&lt;]+/g,u=>`<a target="_blank" rel="noopener" href="${u}">${u}</a>`)}</div>${(p.files||[]).map(f=>`<p><a href="${f.url}" target="_blank" rel="noopener">📎 ${esc(f.name)}</a></p>`).join('')}<div class="row wrap" style="margin-top:23px">${i>0?button('قبلی',`go('article',{id:'${items[i-1].id}'})`):''}${button('بازگشت به فهرست',`go('listing',{s:'${p.subject}',c:'${p.section}'})`)}${i<items.length-1?button('بعدی',`go('article',{id:'${items[i+1].id}'})`):''}</div></article>`}function admin(){if(!isAdmin())return `<div class="glass panel empty">فقط مدیر کل اجازه انتشار مطالب درسی را دارد.<p class="hint">این نقش‌ها در نسخه نمایشی انتخابی هستند و هنوز امن نیستند.</p></div>`;let ps=get('posts');return heading('👑 مدیریت محتوای نهمینو','انتشار مطالب فقط توسط مدیر')+`<div class="row wrap" style="margin-bottom:15px">${button('افزودن مطلب',"go('articleEdit')",'primary')}${button('ساخت آزمون',"go('examEdit')")}${button('استودیوی AI',"go('ai')")}</div><div class="glass panel list">${ps.length?ps.map(p=>`<div class="item"><span style="flex:1">${esc(p.title)} <span class="tag">${esc(lesson(p.subject)?.[1])}</span></span>${button('ویرایش',`go('articleEdit',{id:'${p.id}'})`)}${button('حذف',`removePost('${p.id}')`,'subtle danger')}</div>`).join(''):'<div class="empty">مطلبی ثبت نشده است.</div>'}</div>`}function articleEdit(){if(!isAdmin())return '<div class="notice">فقط مدیر اجازه انتشار دارد</div>';let p=get('posts').find(x=>x.id===args.id)||{};return heading(p.id?'ویرایش مطلب':'مطلب جدید')+`<form class="glass panel fields" onsubmit="savePost(event)"><label>درس</label><select id="ps">${lessons.map(x=>`<option value="${x[0]}" ${x[0]===p.subject?'selected':''}>${x[1]}</option>`).join('')}</select><label>بخش</label><select id="pc">${sections.map(x=>`<option value="${x[0]}" ${x[0]===p.section?'selected':''}>${x[1]}</option>`).join('')}</select><label>عنوان</label><input id="pt" required maxlength="180" value="${esc(p.title||'')}"><label>متن مطلب</label><textarea id="pb" style="min-height:240px">${esc(p.text||'')}</textarea><label>لینک فایل پیوست (اختیاری؛ فایل باید در فضای ذخیره‌سازی عمومی مجاز باشد)</label><input id="pf" type="url" placeholder="https://..." value="${esc(p.files?.[0]?.url||'')}"><p class="hint">بارگذاری مستقیم فایل‌ها پس از اتصال Supabase Storage فعال می‌شود.</p><button class="primary">ذخیره و انتشار مطلب</button></form>`}function savePost(e){e.preventDefault();let ps=get('posts'),p={id:args.id||uuid(),subject:h('ps').value,section:h('pc').value,title:h('pt').value,text:h('pb').value,files:h('pf').value?[{name:'مشاهده فایل پیوست',url:h('pf').value}]:[]};set('posts',args.id?ps.map(x=>x.id===args.id?p:x):[...ps,p]);go('admin')}function removePost(id){if(!isAdmin()||!confirm('مطلب حذف شود؟'))return;set('posts',get('posts').filter(p=>p.id!==id));render()}
function exams(){let exams=get('exams').filter(x=>x.published||isStaff());return heading('📝 مرکز امتحانات','سؤالات تصویری، چهارگزینه‌ای و تشریحی')+`${isStaff()?`<div class="row wrap" style="margin-bottom:15px">${button('طراحی امتحان',"go('examEdit')",'primary')}${button('ساخت با هوش مصنوعی',"go('ai')")}</div>`:''}<div class="list">${exams.length?exams.map(e=>`<div class="glass panel row between wrap"><div><h3>${esc(e.title)}</h3><div class="muted small">${esc(lesson(e.subject)?.[1])} • ${e.questions.length} سؤال • <span class="${e.published?'success':''}">${e.published?'منتشرشده':'پیش‌نویس'}</span></div></div><div class="row wrap">${e.published?button('شرکت در امتحان',`go('examTake',{id:'${e.id}'})`,'primary'):''}${isStaff()?button('ویرایش',`go('examEdit',{id:'${e.id}'})`):''}${isAdmin()?button(e.published?'برداشتن از انتشار':'انتشار',`togglePublish('${e.id}')`):''}</div></div>`).join(''):'<div class="glass empty">هنوز آزمونی ایجاد نشده است.</div>'}</div>`}function togglePublish(id){if(!isAdmin())return;set('exams',get('exams').map(e=>e.id===id?{...e,published:!e.published}:e));render()}function examEdit(){if(!isStaff())return '<div class="notice">فقط مدیر یا معلم می‌تواند امتحان بسازد</div>';let e=get('exams').find(x=>x.id===args.id);editExam=e?.id||null;draft=structuredClone(e?.questions ?? draft);return heading(e?'ویرایش امتحان':'طراحی امتحان جدید','سؤال‌های AI را پیش از انتشار بررسی کن')+`<form class="glass panel fields" onsubmit="saveExam(event)"><label>عنوان امتحان</label><input id="examTitle" required value="${esc(e?.title||'')}"><label>درس</label><select id="examSubject">${lessons.map(x=>`<option value="${x[0]}" ${x[0]===e?.subject?'selected':''}>${x[1]}</option>`).join('')}</select><div class="row wrap">${button('افزودن چهارگزینه‌ای','addQ("mcq")')}${button('افزودن تشریحی','addQ("text")')}${button('کمک AI',"go('ai')")}</div><div id="questions"></div><div class="notice">انتشار آزمون فقط توسط مدیر انجام می‌شود. معلم می‌تواند پیش‌نویس بسازد و مدیر قبل از انتشار سؤال‌ها را ببیند.</div><button class="primary" type="submit">ذخیره پیش‌نویس</button></form>`}function rebuildQuestions(){let el=h('questions');if(!el)return;el.innerHTML=draft.map((q,i)=>`<div class="qcard"><div class="row between"><b>سؤال ${i+1} • ${q.type==='mcq'?'چهارگزینه‌ای':'تشریحی'}</b>${button('حذف',`removeQ(${i})`,'subtle danger')}</div><label>صورت سؤال</label><textarea onchange="draft[${i}].text=this.value">${esc(q.text)}</textarea>${q.type==='mcq'?`<div class="optgrid">${[0,1,2,3].map(j=>`<div><label>گزینه ${j+1}</label><input value="${esc(q.options?.[j]||'')}" onchange="draft[${i}].options[${j}]=this.value"></div>`).join('')}</div><label>شماره گزینه صحیح (۱ تا ۴)</label><input type="number" min="1" max="4" value="${q.answer+1}" onchange="draft[${i}].answer=Number(this.value)-1">`:`<label>پاسخ معیار</label><textarea onchange="draft[${i}].answer=this.value">${esc(q.answer||'')}</textarea>`}<label>دلیل یا توضیح پاسخ</label><input value="${esc(q.reason||'')}" onchange="draft[${i}].reason=this.value"><label>بارم</label><input type="number" min="0.25" max="20" step="0.25" value="${q.points||1}" onchange="draft[${i}].points=Number(this.value)"></div>`).join('')||'<div class="empty">سؤالی افزوده نشده است.</div>'}function addQ(type){draft.push({text:'',type,options:type==='mcq'?['','','','']:[],answer:type==='mcq'?0:'',reason:'',points:1});rebuildQuestions()}function removeQ(i){draft.splice(i,1);rebuildQuestions()}function saveExam(e){e.preventDefault();if(!isStaff())return;let es=get('exams');if(!draft.length||draft.some(q=>!q.text.trim()||q.type==='mcq'&&(q.options.some(o=>!o.trim())||q.answer<0||q.answer>3)))return alert('صورت سؤال، گزینه‌ها و کلید پاسخ را کامل کن.');const exam={id:editExam||uuid(),title:h('examTitle').value,subject:h('examSubject').value,questions:draft,published:es.find(e=>e.id===editExam)?.published||false,author:name};set('exams',editExam?es.map(x=>x.id===editExam?exam:x):[...es,exam]);draft=[];go('exams')}
function examTake(){let e=get('exams').find(x=>x.id===args.id);if(!e?.published)return '<div class="notice">آزمون منتشر نشده است.</div>';return heading('✍️ '+e.title,lesson(e.subject)?.[1])+`<form class="glass panel" onsubmit="finishExam(event,'${e.id}')"><p class="notice">تصحیح این نسخه فقط نمایشی و محلی است. پیش از استفاده واقعی از دانش‌آموزان، پاسخنامه و تصحیح باید به سرور منتقل شوند.</p>${e.questions.map((q,i)=>`<div class="qcard"><strong>${i+1}. ${esc(q.text)}</strong> <span class="tag">${q.points||1} نمره</span>${q.type==='mcq'?q.options.map((opt,j)=>`<label class="option"><input type="radio" name="q${i}" value="${j}"> ${esc(opt)}</label>`).join(''):`<textarea name="q${i}" placeholder="پاسخ تشریحی را بنویس..."></textarea>`}</div>`).join('')}<button class="primary">ثبت پاسخ و مشاهده نتیجه</button></form>`}function finishExam(ev,id){ev.preventDefault();let e=get('exams').find(x=>x.id===id);let fd=new FormData(ev.target),total=e.questions.reduce((s,q)=>s+Number(q.points||1),0),score=0;let feedback=e.questions.map((q,i)=>{let a=fd.get('q'+i)||'',right=q.type==='mcq'?Number(a)===q.answer:false;score+=right?Number(q.points||1):0;return {question:q.text,correct:right,answer:a,reason:q.reason|| (q.type==='mcq'?'پاسخ صحیح: '+q.options[q.answer]:'پاسخ تشریحی نیازمند بررسی معلم یا AI است.'),pending:q.type!=='mcq'}});const record={id:uuid(),examId:id,exam:e.title,student:name,score,total,date:new Date().toISOString(),feedback};set('attempts',[...get('attempts'),record]);h('main').innerHTML=`${heading('نتیجه آزمون')}<div class="glass panel"><h2>نمره فعلی: ${score} از ${total}</h2><p class="notice">پاسخ‌های تشریحی هنوز تصحیح نهایی نشده‌اند؛ نمره فعلی فقط بخش تستی است.</p>${feedback.map((f,i)=>`<div class="qcard"><b>${i+1}. ${esc(f.question)}</b><p class="${f.pending?'muted':f.correct?'success':'red'}">${f.pending?'⏳ نیازمند تصحیح':f.correct?'✓ صحیح':'✕ غلط'}</p><p>${esc(f.reason)}</p></div>`).join('')}${button('دیدن کارنامه',"go('scores')",'primary')}</div>`}
function scores(){let rs=get('attempts'),es=get('exams');let aggregated=rs.slice().sort((a,b)=>b.score/(b.total||1)-a.score/(a.total||1));let consent=localStorage.getItem(K+'publicScores')==='yes';return heading('🏆 نمرات و رتبه‌ها','جدول روزانه، هفتگی، ماهانه و برترین‌ها')+`<div class="notice">نمایش عمومی نمره دانش‌آموزان باید با اطلاع‌رسانی و رضایت معتبر انجام شود؛ فعلاً داده‌های نمونه این مرورگر نمایش داده می‌شوند. برای نسخه عمومی از نام مستعار یا شناسه نمایشی استفاده می‌کنیم.</div><div class="row wrap" style="margin:15px 0"><button class="chip" onclick="period('day')">روزانه</button><button class="chip" onclick="period('week')">هفتگی</button><button class="chip" onclick="period('month')">ماهانه</button><button class="chip" onclick="period('all')">همه</button></div><div class="glass panel" id="scoreArea"></div>`+foot()}function period(p){let now=Date.now(),list=get('attempts').filter(a=>p==='all'||now-new Date(a.date).getTime()<(p==='day'?86400000:p==='week'?604800000:2678400000));list.sort((a,b)=>b.score/(b.total||1)-a.score/(a.total||1));h('scoreArea').innerHTML=`<h3>📊 عملکرد ${({day:'روزانه',week:'هفتگی',month:'ماهانه',all:'کل دوره'})[p]}</h3>${list.length?list.map((a,i)=>`<div class="leader"><div class="rank">${['🥇','🥈','🥉'][i]||i+1}</div><div><b>${esc(a.student)}</b><div class="small muted">${esc(a.exam)}</div></div><div class="barbg"><div class="barfill" style="width:${Math.min(100,Math.max(0,100*a.score/(a.total||1)))}%"></div></div><b>${a.score}/${a.total}</b></div>`).join(''):'<div class="empty">هنوز نتیجه‌ای در این بازه وجود ندارد.</div>'}`}const oldRender=render;render=function(){oldRender();if(route==='scores')period('all')};
function ai(){return heading('🧠 استودیوی هوش مصنوعی','ساخت سؤال، جزوه، تبدیل عکس به امتحان و بازخورد با دلیل')+`<div class="glass panel fields"><div class="notice">برای جلوگیری از اتمام سهمیه رایگان Gemini، تولید AI فقط برای مدیر فعال خواهد شد. بخش هوش مصنوعی تا نصب تابع سروری و اتصال احراز هویت واقعی، فعال نیست.</div><div class="two"><div><label>نوع خروجی</label><select id="aiMode"><option value="exam">طرح آزمون</option><option value="lesson">ساخت جزوه</option><option value="convert">تبدیل سؤال‌ها به چهارگزینه‌ای/تشریحی</option><option value="grade">بازخورد صحیح/غلط و دلیل</option></select></div><div><label>درس</label><select id="aiSubject">${lessons.map(l=>`<option value="${l[1]}">${l[1]}</option>`).join('')}</select></div></div><label>موضوع یا فصل</label><input id="aiTopic" placeholder="مثلاً فصل ۳ علوم، رفتار اتم‌ها"><label>متن منبع یا سؤال‌ها</label><textarea id="aiSource" placeholder="متن سؤال، جزوه یا اطلاعات موردنظر را اینجا وارد کن..."></textarea><label>عکس برگه امتحان (اختیاری، حداکثر ۴ مگابایت)</label><input type="file" accept="image/jpeg,image/png,image/webp" id="aiImage" onchange="loadImage(event)"><div id="imageLabel" class="hint"></div><div class="two"><div><label>تعداد سؤال</label><input id="aiCount" type="number" value="5" min="1" max="10"></div><div><label>نوع سؤال</label><select id="aiKind"><option value="mixed">ترکیبی</option><option value="mcq">چهارگزینه‌ای</option><option value="text">تشریحی</option></select></div></div><button class="primary" id="aiBtn" onclick="generateAI()">✨ تولید با Gemini (فقط مدیر)</button><div id="aiOutput"></div></div>`}function loadImage(ev){let f=ev.target.files[0];imageData=null;if(!f)return;if(f.size>4*1024*1024||!['image/png','image/jpeg','image/webp'].includes(f.type)){alert('فقط عکس JPG/PNG/WebP تا ۴ مگابایت');ev.target.value='';return}let reader=new FileReader();reader.onload=()=>{imageData={mimeType:f.type,data:reader.result.split(',')[1]};h('imageLabel').textContent='✅ عکس آماده پردازش: '+f.name};reader.readAsDataURL(f)}async function generateAI(){if(!isAdmin())return alert('در نسخه نهایی فقط مدیر پس از ورود امن می‌تواند از سهمیه AI استفاده کند.');let mode=h('aiMode').value,subject=h('aiSubject').value,topic=h('aiTopic').value.trim(),source=h('aiSource').value.trim();if(!topic||(!source&&!imageData))return alert('موضوع و متن یا عکس منبع را وارد کن.');let btn=h('aiBtn');btn.disabled=true;btn.textContent='در حال پردازش…';h('aiOutput').innerHTML='';try{let res=await fetch('/api/ai',{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+sessionToken},body:JSON.stringify({mode,subject,topic,source,count:Number(h('aiCount').value),kind:h('aiKind').value,image:imageData})});let data=await res.json();if(!res.ok)throw Error(data.error||`خطای ${res.status}`);if(data.questions){draft=data.questions.map(q=>({...q,points:1}));h('aiOutput').innerHTML=`<div class="notice success">${draft.length} سؤال ساخته شد. قبل از انتشار باید بررسی شوند.</div><div class="list">${draft.map((q,i)=>`<div class="qcard"><b>${i+1}. ${esc(q.text)}</b><p class="muted">${q.type==='mcq'?esc(q.options.join(' / ')):''}</p><p class="small">${esc(q.reason||'')}</p></div>`).join('')}</div>${button('انتقال سؤال‌ها به پیش‌نویس امتحان',"go('examEdit')",'primary')}`;}else h('aiOutput').innerHTML=`<div class="qcard" style="white-space:pre-wrap;line-height:2.2">${esc(data.text||data.feedback||'')}</div>${mode==='lesson'?button('کپی جزوه','copyLesson()'):''}`;window.latestLesson=data.text||''}catch(e){h('aiOutput').innerHTML=`<p class="notice">${esc(e.message)}. برای راه‌اندازی واقعی، تابع سروری و Supabase Auth باید پیکربندی شوند.</p>`}finally{btn.disabled=false;btn.textContent='✨ تولید با Gemini (فقط مدیر)'}}function copyLesson(){navigator.clipboard.writeText(window.latestLesson||'').then(()=>alert('کپی شد'))}async function showRealLogin(){h('modal').innerHTML=`<div class="modal" onclick="if(event.target===this)this.remove()"><div class="glass panel dialog"><h2>ورود امن نهمینو</h2><p class="muted">با ایمیل و گذرواژه حساب Supabase وارد شو.</p><div class="fields"><label>ایمیل</label><input id="authEmail" type="email" autocomplete="email"><label>گذرواژه</label><input id="authPass" type="password" autocomplete="current-password"><button class="primary" onclick="realLogin()">ورود</button><button class="subtle" onclick="realRegister()">ساخت حساب دانش‌آموز</button>${sessionToken?'<button class="subtle danger" onclick="realLogout()">خروج</button>':''}<div id="authMsg" class="hint"></div></div></div></div>`}
async function realLogin(){try{let email=h('authEmail').value, password=h('authPass').value;let r=await fetch(window.SUPABASE_URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:window.SUPABASE_ANON_KEY,'content-type':'application/json'},body:JSON.stringify({email,password})});let d=await r.json();if(!r.ok)throw Error(d.error_description||d.msg||'ورود ناموفق');sessionToken=d.access_token;localStorage.setItem(K+'token',sessionToken);await syncProfile();h('modal').innerHTML='';render()}catch(e){h('authMsg').textContent=e.message}}
async function realRegister(){try{let r=await fetch(window.SUPABASE_URL+'/auth/v1/signup',{method:'POST',headers:{apikey:window.SUPABASE_ANON_KEY,'content-type':'application/json'},body:JSON.stringify({email:h('authEmail').value,password:h('authPass').value})});let d=await r.json();if(!r.ok)throw Error(d.msg||d.error_description||'ثبت نام ناموفق');h('authMsg').textContent='حساب ایجاد شد؛ در صورت نیاز ایمیل تأیید را بررسی کن. نقش پیش‌فرض دانش‌آموز است.'}catch(e){h('authMsg').textContent=e.message}}
async function syncProfile(){if(!sessionToken||!window.SUPABASE_URL)return;let r=await fetch(window.SUPABASE_URL+'/rest/v1/profiles?select=display_name,role&limit=1',{headers:{apikey:window.SUPABASE_ANON_KEY,authorization:'Bearer '+sessionToken}});if(r.ok){let d=await r.json();if(d[0]){name=d[0].display_name||'کاربر';role=d[0].role==='admin'?'admin':d[0].role==='teacher'?'teacher':'student'}}else{realLogout(false)}}
function realLogout(redraw=true){sessionToken='';localStorage.removeItem(K+'token');role='student';name='دانش‌آموز مهمان';h('modal').innerHTML='';if(redraw)render()}
if(window.SUPABASE_URL&&window.SUPABASE_ANON_KEY&&sessionToken)syncProfile().then(render);else render();
</script></body></html>
